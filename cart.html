<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SevaSetu | Cart</title>

<style>
:root {
  --primary: #2d9a63;
  --dark: #2c3e50;
  --light: #f4f7f6;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: var(--light);
}

/* NAVBAR */
.navbar {
  background: white;
  padding: 15px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: var(--primary);
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 25px;
}

.nav-links a {
  text-decoration: none;
  color: var(--dark);
  font-weight: 500;
}

.profile-btn {
  color: var(--primary);
  font-weight: bold;
}

/* CART */
.cart-container {
  max-width: 900px;
  background: white;
  margin: 40px auto;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.cart-container h2 {
  text-align: center;
  color: var(--primary);
  margin-bottom: 20px;
}

.cart-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
  gap: 15px;
}

.cart-item img {
  width: 60px;
  height: 60px;
  border-radius: 8px;
  object-fit: cover;
}

.item-info {
  flex: 1;
}

.qty {
  display: flex;
  align-items: center;
  gap: 10px;
}

.qty button {
  padding: 4px 10px;
  cursor: pointer;
}

.remove-btn {
  background: crimson;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.summary {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 2px dashed #ddd;
}

.summary p, .summary h3 {
  display: flex;
  justify-content: space-between;
  margin: 8px 0;
}

.cart-actions {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

.cart-actions button {
  background: var(--primary);
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
}

.cart-actions .clear {
  background: #999;
}
</style>
</head>

<body>

<header class="navbar">
  <div class="logo">SEVASETU</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="medicine.html">Medicines</a></li>
    <li><a href="doctors.html">Doctors</a></li>
    <li><a href="cart.html" class="profile-btn">Cart</a></li>
  </ul>
</header>

<div class="cart-container">
  <h2>Your Cart 🛒</h2>

  <div id="cart-items"></div>

  <div class="summary">
    <p>Subtotal: ₹<span id="subtotal">0</span></p>
    <p>Delivery: ₹20</p>
    <h3>Total: ₹<span id="total">0</span></h3>
  </div>

  <div class="cart-actions">
    <button class="clear" onclick="clearCart()">Clear Cart</button>
    <a href="./payment.html"><button>Proceed to Payment</button></a>
  </div>
</div>

<script>
// Demo cart if empty
let cart = JSON.parse(localStorage.getItem("cart")) || [
  { name: "Taxim-O 200", price: 120, qty: 1, img: "https://via.placeholder.com/60" },
  { name: "Clavam 625", price: 150, qty: 1, img: "https://via.placeholder.com/60" }
];

function renderCart() {
  const cartDiv = document.getElementById("cart-items");
  cartDiv.innerHTML = "";
  let subtotal = 0;

  cart.forEach((item, index) => {
    subtotal += item.price * item.qty;

    cartDiv.innerHTML += `
      <div class="cart-item">
        <img src="${item.img}">
        <div class="item-info">
          <strong>${item.name}</strong><br>
          ₹${item.price}
        </div>
        <div class="qty">
          <button onclick="changeQty(${index}, -1)">-</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${index}, 1)">+</button>
        </div>
        <strong>₹${item.price * item.qty}</strong>
        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
      </div>
    `;
  });

  document.getElementById("subtotal").innerText = subtotal;
  document.getElementById("total").innerText = subtotal + 20;

  localStorage.setItem("cart", JSON.stringify(cart));
}

function changeQty(index, value) {
  cart[index].qty += value;
  if (cart[index].qty < 1) cart[index].qty = 1;
  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  renderCart();
}

function clearCart() {
  cart = [];
  localStorage.removeItem("cart");
  renderCart();
}

renderCart();
</script>

</body>
</html>
